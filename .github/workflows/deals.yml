name: Forgotten Deals Bot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hunt Steam bargains
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot.py

      - name: Save posted deals
        run: |
          git config user.name "Forgotten Deals Bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted_deals.json
          git diff --cached --quiet || (
            git commit -m "Update posted deals"
            git push
          )
