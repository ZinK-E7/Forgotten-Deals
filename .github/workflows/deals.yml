
name: Forgotten Deals Hunter

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forgotten-deals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  find-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot files
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hunt Steam bargains
        run: python bot.py

      - name: Save deal history
        run: |
          git config user.name "Forgotten Deals Bot"
          git config user.email "bot@users.noreply.github.com"

          git add pending_deals.json posted_deals.json

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update collected deals"
          git pull --rebase origin main
          git push origin main
