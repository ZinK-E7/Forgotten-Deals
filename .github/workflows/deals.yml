
name: Forgotten Deals Bot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forgotten-deals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  find-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot files
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hunt Steam bargains
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot.py

      - name: Save posted deals safely
        run: |
          git config user.name "Forgotten Deals Bot"
          git config user.email "bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Saving deal history: attempt $attempt"

            git fetch origin main

            python - <<'PY'
          import json
          import subprocess

          try:
              with open("posted_deals.json", "r") as f:
                  local = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              local = []

          try:
              remote_data = subprocess.check_output(
                  ["git", "show", "origin/main:posted_deals.json"],
                  text=True
              )
              remote = json.loads(remote_data)
          except (subprocess.CalledProcessError, json.JSONDecodeError):
              remote = []

          merged = sorted(set(local) | set(remote))

          with open("/tmp/posted_deals.json", "w") as f:
              json.dump(merged, f, indent=2)
          PY

            git reset --hard origin/main
            cp /tmp/posted_deals.json posted_deals.json

            git add posted_deals.json

            if git diff --cached --quiet; then
              echo "No new deal history to save."
              exit 0
            fi

            git commit -m "Update posted deals"

            if git push origin HEAD:main; then
              echo "Deal history saved successfully."
              exit 0
            fi

            echo "Push rejected. Retrying..."
          done

          echo "Could not save deal history after 3 attempts."
          exit 1
