
name: Forgotten Deals Friday Roundup

on:
  schedule:
    - cron: "0 11,12 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forgotten-deals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-roundup:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot files
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish Friday roundup
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python roundup.py

      - name: Save posted deals
        run: |
          git config user.name "Forgotten Deals Bot"
          git config user.email "bot@users.noreply.github.com"

          git add posted_deals.json pending_deals.json

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Publish Friday deals roundup"
          git pull --rebase origin main
          git push origin main
